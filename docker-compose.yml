
services:
  postgres:
    image: postgres:17
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "wal_keep_size=256MB", "-c", "shared_preload_libraries=pg_stat_statements"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-ecommerce}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      DB_READ_REPLICA_ENABLED: ${DB_READ_REPLICA_ENABLED:-true}
      DB_REPLICA_HOST: postgres-replica
      DB_REPLICA_PORT: 5432
      CATALOG_CACHE_ENABLED: ${CATALOG_CACHE_ENABLED:-true}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-30}
      REDIS_URL: redis://redis:6379
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:?Set CUSTOMER_JWT_SECRET in .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in .env}
      INVENTORY_DRIVER: ${INVENTORY_DRIVER:-grpc}
      WAREHOUSE_GRPC_URL: warehouse:50051
      WAREHOUSE_GRPC_TIMEOUT_MS: ${WAREHOUSE_GRPC_TIMEOUT_MS:-3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - warehouse

  replication-setup:
    image: postgres:17
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGDATABASE: ${DB_DATABASE:-ecommerce}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:?Set DB_REPLICATION_PASSWORD in .env}
    volumes:
      - postgres_data:/primary
      - ./docker/setup-replication.sh:/scripts/setup-replication.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-replication.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres-replica:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-ecommerce}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:?Set DB_REPLICATION_PASSWORD in .env}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/start-replica.sh:/scripts/start-replica.sh:ro
    ports:
      - "127.0.0.1:${DB_REPLICA_PORT:-5435}:5432"
    entrypoint: ["/bin/sh", "/scripts/start-replica.sh"]
    depends_on:
      replication-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -Atc 'SELECT pg_is_in_recovery()' | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/database/init-schema.js"]
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:?Set SEED_CUSTOMER_PASSWORD in .env}
      SEED_SYNC_SCHEMA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/database/seed.js"]
volumes:
  postgres_data:
  postgres_replica_data:

networks:
  warehouse:
    external: true
    name: ecommerce-warehouse
