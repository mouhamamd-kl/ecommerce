
services:
  postgres:
    image: postgres:17
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "wal_keep_size=256MB", "-c", "shared_preload_libraries=pg_stat_statements"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-ecommerce}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ecommerce-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      DB_READ_REPLICA_ENABLED: ${DB_READ_REPLICA_ENABLED:-true}
      DB_REPLICA_HOST: postgres-replica
      DB_REPLICA_PORT: 5432
      CATALOG_CACHE_ENABLED: ${CATALOG_CACHE_ENABLED:-true}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-30}
      REDIS_URL: redis://redis:6379
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:?Set CUSTOMER_JWT_SECRET in .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in .env}
      INVENTORY_DRIVER: ${INVENTORY_DRIVER:-grpc}
      WAREHOUSE_GRPC_URL: warehouse:50051
      WAREHOUSE_GRPC_TIMEOUT_MS: ${WAREHOUSE_GRPC_TIMEOUT_MS:-3000}
      ASYNC_EVENTS_ENABLED: ${ASYNC_EVENTS_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:-ecommerce}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      EMAIL_RETRY_DELAY_MS: ${EMAIL_RETRY_DELAY_MS:-5000}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-ecommerce}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:-ecommerce-local}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:?Set PUSHER_APP_SECRET in .env}
      PUSHER_HOST: soketi
      PUSHER_PORT: 6001
      PUSHER_PUBLIC_HOST: ${PUSHER_PUBLIC_HOST:-localhost}
      PUSHER_PUBLIC_PORT: ${PUSHER_PUBLIC_PORT:-6001}
      PUSHER_PUBLIC_TLS: ${PUSHER_PUBLIC_TLS:-false}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - warehouse

  replication-setup:
    image: postgres:17
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGDATABASE: ${DB_DATABASE:-ecommerce}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:?Set DB_REPLICATION_PASSWORD in .env}
    volumes:
      - postgres_data:/primary
      - ./docker/setup-replication.sh:/scripts/setup-replication.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-replication.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres-replica:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-ecommerce}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:?Set DB_REPLICATION_PASSWORD in .env}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/start-replica.sh:/scripts/start-replica.sh:ro
    ports:
      - "127.0.0.1:${DB_REPLICA_PORT:-5435}:5432"
    entrypoint: ["/bin/sh", "/scripts/start-replica.sh"]
    depends_on:
      replication-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -Atc 'SELECT pg_is_in_recovery()' | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-ecommerce}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-ecommerce-local}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:?Set PUSHER_APP_SECRET in .env}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"
      SOKETI_DEBUG: "false"
    ports:
      - "127.0.0.1:6001:6001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:6001/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  email-worker:
    image: ecommerce-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/async-events/email-worker.js"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:-ecommerce}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-mailpit}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-4}
      EMAIL_RETRY_DELAY_MS: ${EMAIL_RETRY_DELAY_MS:-5000}
      MAILPIT_HOST: mailpit
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:5173}
      MAIL_CURRENCY: ${MAIL_CURRENCY:-USD}
    depends_on:
      init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/order-email-worker.health','utf8'))<15000?0:1)"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10

  init:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/database/init-schema.js"]
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:?Set SEED_CUSTOMER_PASSWORD in .env}
      SEED_SYNC_SCHEMA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/database/seed.js"]
volumes:
  postgres_data:
  postgres_replica_data:
  rabbitmq_data:
  mailpit_data:

networks:
  warehouse:
    external: true
    name: ecommerce-warehouse
